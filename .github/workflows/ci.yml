name: CI

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        run: npm run check
      - name: Composer metadata
        run: php -r '$j=json_decode(file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR); echo $j["name"], PHP_EOL;'
      - name: Composer validate
        run: composer validate --no-check-publish --no-check-lock
      - name: Field catalog self-check
        run: php tests/check-field-catalog.php

name: Bug report
description: Report an editor, Drupal integration, or compatibility problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: input
    id: drupal
    attributes:
      label: Drupal version
    validations:
      required: true
  - type: input
    id: gutenberg
    attributes:
      label: Drupal Gutenberg version/commit
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console/server errors

gutenberg_next.settings:
  path: '/admin/config/content/gutenberg-next'
  defaults:
    _form: '\Drupal\gutenberg_next\Form\SettingsForm'
    _title: 'Gutenberg Next'
  requirements:
    _permission: 'administer gutenberg next'

gutenberg_next.status:
  path: '/admin/config/content/gutenberg-next/status'
  defaults:
    _controller: '\Drupal\gutenberg_next\Controller\StatusController::build'
    _title: 'Gutenberg Next status'
  requirements:
    _permission: 'administer gutenberg next'

gutenberg_next.field_autosave.save:
  path: '/editor/gutenberg-next/autosave/{entity_type}/{entity_id}'
  defaults:
    _controller: '\Drupal\gutenberg_next\Controller\FieldAutosaveController::save'
    _format: 'json'
  methods: [POST]
  requirements:
    _permission: 'use gutenberg'
    _csrf_request_header_token: 'TRUE'
    entity_type: 'node'
  options:
    no_cache: TRUE

gutenberg_next.field_autosave.load:
  path: '/editor/gutenberg-next/autosave/{entity_type}/{entity_id}'
  defaults:
    _controller: '\Drupal\gutenberg_next\Controller\FieldAutosaveController::load'
    _format: 'json'
  methods: [GET]
  requirements:
    _permission: 'use gutenberg'
    entity_type: 'node'
  options:
    no_cache: TRUE

gutenberg_next.field_autosave.clear:
  path: '/editor/gutenberg-next/autosave/{entity_type}/{entity_id}'
  defaults:
    _controller: '\Drupal\gutenberg_next\Controller\FieldAutosaveController::clear'
    _format: 'json'
  methods: [DELETE]
  requirements:
    _permission: 'use gutenberg'
    _csrf_request_header_token: 'TRUE'
    entity_type: 'node'
  options:
    no_cache: TRUE

gutenberg_next.revision_list:
  path: '/editor/gutenberg-next/revisions/node/{node}'
  defaults:
    _controller: '\Drupal\gutenberg_next\Controller\RevisionController::revisionList'
    _format: 'json'
  methods: [GET]
  requirements:
    _custom_access: '\Drupal\gutenberg_next\Controller\RevisionController::revisionListAccess'
  options:
    no_cache: TRUE
    parameters:
      node:
        type: entity:node

gutenberg_next.revision_view:
  path: '/editor/gutenberg-next/revisions/node/{node}/{node_revision}'
  defaults:
    _controller: '\Drupal\gutenberg_next\Controller\RevisionController::revisionView'
    _format: 'json'
  methods: [GET]
  requirements:
    # Core 11.4 removed the _access_node_revision requirement along with
    # NodeRevisionAccessCheck; this mirrors core's entity.node.revision route.
    _entity_access: 'node_revision.view revision'
  options:
    no_cache: TRUE
    parameters:
      node:
        type: entity:node
      node_revision:
        type: entity_revision:node
